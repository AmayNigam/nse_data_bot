name: Daily NSE Update

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST, Monday (1) through Friday (5)
    - cron: '30 13 * * 1-5'
  
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests yfinance pandas
        
      - name: Execute Script
        run: python automation1.pys
        
      - name: Execute Script
        run: python automation1.py
